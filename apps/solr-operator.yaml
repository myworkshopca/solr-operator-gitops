apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solr-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://solr.apache.org/charts
    chart: solr-operator
    targetRevision: 0.9.0
    helm:
      releaseName: solr-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: solr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
